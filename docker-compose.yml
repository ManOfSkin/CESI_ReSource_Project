version: '3.8'

services:
  httpd:
    build:
      context: ./docker/httpd
    container_name: httpd
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/usr/local/apache2/htdocs
      - ./docker/httpd/.env:/usr/local/apache2/htdocs/.env
      - ./docker/httpd/conf/000-default.conf:/usr/local/apache2/conf.d/000-default.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`cesi.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"

  php:
    build:
      context: ./docker/php
    container_name: php
    networks:
      - web
      - db
    expose:
      - 9000
    volumes:
        - ./docker/httpd/.env:/usr/local/apache2/htdocs/.env
        - ./:/usr/local/apache2/htdocs

  mariadb:
    build:
      context: ./docker/mariadb
    container_name: mariadb
    ports:
       - "3306:3306"
    networks:
      - db
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "test"
      MYSQL_USER: "test"
      MYSQL_PASSWORD: "test"

  pma:
    build:
      context: ./docker/pma
    container_name: pma
    ports:
      - "8081:80"
    networks:
      - web
      - db
    environment:
      PMA_HOST: "mariadb"
      PMA_PORT: "3306"
#      PMA_USER: "test"
#      PMA_PASSWORD: "test"
#      PMA_DATABASE: "test"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`pma.localhost`)"
      - "traefik.http.routers.pma.entrypoints=web"




networks:
  web:
    external: true
  db:
    name: cubes1_db


