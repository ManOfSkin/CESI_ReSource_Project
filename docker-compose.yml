version: '3.8'

services:
  traefik:
    build:
      context: ./docker/traefik
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net
      - internal

#  portainer:
#    image: portainer/portainer-ce:alpine
#    container_name: portainer
#    depends_on:
#      - traefik
#    networks:
#      - internal
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
#    expose:
#      - "8000"
#      - "9443"
#    labels:
#      - "traefik.enable=true"
#      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
#      - "traefik.http.routers.portainer.entrypoints=web"

  httpd:
    build:
      context: ./docker/httpd
    container_name: httpd
    networks:
      - internal
    volumes:
      - ./:/usr/local/apache2/htdocs
      - ./docker/httpd/.env:/usr/local/apache2/htdocs/.env
      - ./docker/httpd/conf/000-default.conf:/usr/local/apache2/conf.d/000-default.conf
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`cesi.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"

  php:
    build:
      context: ./docker/php
    container_name: php
    networks:
      - internal
      - db
    expose:
      - 9000
    volumes:
        - ./docker/httpd/.env:/usr/local/apache2/htdocs/.env
        - ./:/usr/local/apache2/htdocs

  mariadb:
    build:
      context: ./docker/mariadb
    container_name: mariadb
    ports:
       - "3306:3306"
    networks:
      - db
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "test"
      MYSQL_USER: "test"
      MYSQL_PASSWORD: "test"

  pma:
    build:
      context: ./docker/pma
    container_name: pma
    depends_on:
      - mariadb
      - traefik
    ports:
      - "8081:80"
    networks:
      - internal
      - db
    environment:
      PMA_HOST: "mariadb"
      PMA_PORT: "3306"
      PMA_USER: "test"
      PMA_PASSWORD: "test"
      PMA_DATABASE: "test"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`pma.localhost`)"
      - "traefik.http.routers.pma.entrypoints=web"





networks:
  net:
    driver: bridge
  db:
    name: cubes1_db
  internal:
    name: cubes1_internal


